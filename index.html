<style>

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f2e;--sf:#141a4a;--ink:#eef0ff;--mu:#a6aad6;--ln:#2a3170;--ac:#8c97ff;--ai:#0b0f2e;--hi:#ff7a3d}}
:root[data-theme="dark"]{--bg:#0b0f2e;--sf:#141a4a;--ink:#eef0ff;--mu:#a6aad6;--ln:#2a3170;--ac:#8c97ff;--ai:#0b0f2e;--hi:#ff7a3d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 "Avenir Next","Segoe UI",system-ui,sans-serif}
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{background:var(--sf);border-right:1px solid var(--ln);padding:14px;position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:100vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
main{padding:20px 24px 80px;max-width:940px;width:100%}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.nv{text-align:left;min-height:48px;padding:0 14px;border:0;border-radius:10px;background:none;display:flex;align-items:center;justify-content:space-between;width:100%}
.nv.on{background:var(--ac);color:var(--ai);font-weight:600}
.nv.has::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--hi)}
.btn{min-height:46px;padding:0 16px;border-radius:10px;border:1.5px solid var(--ac);background:none;color:var(--ac);font-weight:600}
.btn.pri{background:var(--ac);color:var(--ai)}
.row{display:flex;gap:8px}.row>*{flex:1}
.top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.top h1{margin:0;font-size:28px;flex:1}
.mu{color:var(--mu);font-size:14px}
.sec{display:none}.sec.on{display:block}
h2{font-size:24px;margin:0 0 16px}
h3{margin:10px 0 0;font-size:18px;color:var(--ac)}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 18px}
.w{grid-column:1/-1}
.f{margin-bottom:16px}
label>span,.f>span{display:block;font-weight:600;font-size:14px;color:var(--mu);margin-bottom:6px}
input,textarea,select{width:100%;padding:12px 14px;border:1.5px solid var(--ln);border-radius:10px;background:var(--sf);min-height:48px}
textarea{min-height:100px}
input:focus,textarea:focus,select:focus,.chip:focus-visible,.btn:focus-visible,.nv:focus-visible{outline:3px solid var(--hi);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:46px;padding:0 16px;border-radius:23px;border:1.5px solid var(--ln);background:var(--sf)}
.chip[aria-pressed="true"]{background:var(--ac);color:var(--ai);border-color:var(--ac);font-weight:600}
.chip[aria-pressed="true"]::before{content:"✓ "}
.lrow{display:grid;grid-template-columns:minmax(220px,1.3fr) 90px 1.6fr;gap:8px;margin-bottom:8px}
.lrow .chip{border-radius:10px;text-align:left}
.zt{display:flex;gap:8px;margin-bottom:14px}
.zt .chip{flex:1;border-radius:10px}
.zp{display:none;background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px}.zp.on{display:block}

.lg{width:100%;border-radius:8px;display:block}
.ft{display:block;max-width:100%;margin-top:32px;background:#fff;border-radius:10px;padding:8px}
h2{border-left:8px solid #00cccc;padding-left:12px}
.dd{margin-bottom:16px}.dd summary{min-height:48px;padding:10px 14px;border:1.5px solid var(--ln);border-radius:10px;background:var(--sf);cursor:pointer;display:flex;gap:10px;flex-wrap:wrap;align-items:center}.dd summary em{color:var(--mu);font-style:normal;font-size:14px}.dd[open] summary{border-color:var(--ac)}.dd .chips{padding:12px 4px}

.subt{display:flex;gap:8px;overflow-x:auto;margin:0 0 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:2}.subt .chip{flex:none}.sub{display:none}.sub.on{display:grid}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ac);color:var(--ai);padding:12px 18px;border-radius:12px;font-weight:600;z-index:20;display:none}
.pgd{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:14px}.pc{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}.pc img{width:100%;border-radius:8px}
#rpt{display:none}
body.ms #rpt{display:block;position:absolute;left:-9999px;top:0;width:1000px}

#rpt{font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;color:#0b1045;background:#fff;line-height:1.35}
#rpt *{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#rpt h1,#rpt h2,#rpt h3,#rpt h4,#rpt h5,#rpt p,#rpt dl,#rpt dd,#rpt dt,#rpt ul,#rpt ol,#rpt figure{margin:0;padding:0;border:0}
.pg{container-type:inline-size;position:relative;width:100%;aspect-ratio:297/405;overflow:hidden;break-after:page;break-inside:avoid;background:#fff}.pg:last-child{break-after:auto}
.in{position:absolute;left:0;right:0;top:0;bottom:3.6cqw;overflow:hidden;font-size:12px;font-size:calc(1.25cqw*var(--z,1))}
.pf{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;border-top:.25cqw solid #00cccc;padding-top:.7cqw;font-size:.95cqw;color:#7a7fa6;letter-spacing:.08em;text-transform:uppercase}

.o1{right:-6em;top:-8em;width:26em;height:26em;border-radius:50%;background:#ff5200}.o2{right:8em;bottom:-1em;width:8em;height:12em;background:#00cccc}.o3{right:17em;bottom:-1em;width:6em;height:8em;background:#d7bffb}
.cl{width:13em;border-radius:.5em;display:block}
.cvt small{display:block;margin-top:2.2em;letter-spacing:.24em;color:#00cccc;font-weight:700;font-size:.85em}
.cvt h1{font-size:3.6em;line-height:1;margin:.3em 0 .35em;font-weight:300}.cvt h3{font-size:1.9em;margin-bottom:.2em}.cvt p{color:#d7bffb;font-size:1.05em}
.sy{display:grid;grid-template-columns:22em 1fr;gap:2em;margin-top:1.8em}
.id{position:relative;overflow:hidden;background:#0a14a8;color:#fff;border-radius:1.2em;padding:1.2em 1.4em}.id i{position:absolute;right:-3em;top:-3em;width:8em;height:8em;border-radius:50%;background:#ff5200}.id>*{position:relative}
.id h3{font-size:1.25em;margin-bottom:.8em}.id dl>div{margin-bottom:.7em}.id dt{font-size:.62em;letter-spacing:.1em;text-transform:uppercase;color:#00cccc}.id dd{font-size:.95em;font-weight:600}
.sh2{font-size:.85em;text-transform:uppercase;letter-spacing:.14em;color:#ff5200;margin:0 0 .7em}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:.8em;margin-bottom:1.4em}.kp div{background:#f4f2fb;border-radius:.9em;padding:.8em 1em}.kp b{display:block;font-size:1.5em;color:#0a14a8}.kp span{font-size:.65em;text-transform:uppercase;letter-spacing:.08em;color:#6a6f99}
.tl{columns:2;column-gap:2em}.tl>div{break-inside:avoid;margin-bottom:.8em}#rpt h5{font-size:1em;color:#0a14a8;margin:0 0 .2em}

.rb{height:19em;margin:1.8em 0 1.2em;border-radius:1.4em;background-color:#f4f2fb}.cf{width:100%;display:block;background:#fff;border-radius:.6em}

.rule{height:.4em;border-radius:.2em;margin:.4em 0 .9em;background:linear-gradient(90deg,#0a14a8 0 42%,#00cccc 42% 66%,#ff5200 66% 82%,#d7bffb 82%)}
.cg{display:grid;grid-template-columns:repeat(3,1fr);gap:.8em;align-items:start}
.cd{border:.08em solid #e0ddf0;border-radius:.9em;overflow:hidden;break-inside:avoid}.cd.fw{grid-column:span 2}

   const key=w.dataset.key||'',val=A.v[key],L=(Array.isArray(val)?val:[val]).filter(x=>x&&x!==true);
   if(!L.length||/_nb$|^v_vp$/.test(key))return;
   const x=L.join(', '),sp=w.querySelector(':scope>span,:scope>label>span'),l=sp?sp.textContent:w.dataset.l;
   if(/_com$/.test(key)){notes.push(x);return}
   if(w.dataset.tw){if(L[0]!='Aucun'){tw.push([S[i].t,w.dataset.l,x]);if(id!='v')tws.push(...L)}if(id!='v')return}
   bl[bl.length-1].r.push({l,x,key,w:w.dataset.tw&&L[0]!='Aucun'})});
  if(id=='d'){ident=bl.flatMap(b=>b.r);return}
  const bs=bl.filter(b=>b.r.length);if(bs.length||tws.length||notes.length)ch.push({id,t:S[i].t,bs,tws,notes})});
 let no=1;const hd=(id,t)=>`<div class="chh"><span class="no">${String(++no).padStart(2,'0')}</span><h2>${E(t)}</h2>${ico(id)}</div><div class="rule"></div>`;
 const rw=r=>`<div class="${r.w?'tv':r.x.length>36?'wd':''}"><dt>${r.w?'Travaux à prévoir':E(r.l)}</dt><dd>${E(r.x)}</dd></div>`;
 const card=b=>{const st=b.r.find(r=>/^État/.test(r.l)&&ST2[r.x]),rs=b.r.filter(r=>r!==st);return `<div class="cd${rs.length>6?' fw':''}">${b.t||st?`<div class="cdh"><span>${E(b.t)}</span>${st?`<em class="bd" style="background:${ST2[st.x]}">${E(st.x)}</em>`:''}</div>`:''}<dl>${rs.map(rw).join('')}</dl></div>`};
 const H={};
 ch.forEach(c=>{H[c.id]=`${hd(c.id,c.t)}<div class="cg">${c.bs.map(card).join('')}</div>${c.tws.length?`<div class="tvb"><b>Travaux à prévoir</b><ul>${c.tws.map(x=>`<li>${E(x)}</li>`).join('')}</ul></div>`:''}${c.notes.map(x=>`<div class="nt">${E(x)}</div>`).join('')}`});
 if(ens.length){const mx=Math.max(...ens.map(x=>x.k),1),CL=['#0a14a8','#00cccc','#ff5200','#8a63d2','#7f8cff','#999'];
  H.r=`${hd('r','Consommations')}${ens.map((x,j)=>`<div class="eb"><div class="en"><b>${E(x.m)}</b><small>${E(x.y)}</small></div><div class="bar"><i style="width:${Math.max(3,x.k/mx*100)}%;background:${CL[j%6]}"></i></div><div class="ev"><b>${F(x.k)} kWh</b><span>${F(x.e)} €${x.k&&x.e?' · '+(x.e/x.k).toFixed(3).replace('.',',')+' €/kWh':''}</span></div></div>`).join('')}<div class="tot2"><div><span>Consommation totale</span><b>${F(k)} kWh</b></div><div><span>Facture totale</span><b>${F(e)} €</b></div>${sc&&k?`<div><span>Ratio</span><b>${Math.round(k/sc)} kWh/m²</b></div>`:''}</div>`}
 const idr=[['Adresse',adr],...ident.filter(r=>!/^d_(nom|adr|cp|vil|insee)$/.test(r.key)).map(r=>[r.l,r.x])].filter(r=>r[1]);
 const kp=[['Surface chauffée',sc?F(sc)+' m²':'–'],['Construction',v.d_per||'–'],['Occupation',v.d_hr?v.d_hr+' h '+(v.d_hp||'').toLowerCase():'–'],['Consommation',k?F(k)+' kWh/an':'–'],['Facture',e?F(e)+' €/an':'–'],['Ratio énergétique',k&&sc?Math.round(k/sc)+' kWh/m²':'–']];
 const tg={};tw.forEach(([c,l,x])=>{(tg[c]=tg[c]||[]).push([l,x])});
 const p1=`<div class="cvt"><i class="o1"></i><i class="o2"></i><i class="o3"></i><img class="cl" src="${$('.lg').src}"><small>AUDIT ÉNERGÉTIQUE · FICHE DE VISITE</small><h1>Rapport de visite</h1><h3>${E(v.d_nom||'Bâtiment')}</h3><p>${E(adr)}</p><p>Visite du ${d}${v.d_parc?' · Parcelle '+E(v.d_parc):''}</p></div>
<div class="sy"><div class="id"><i></i><h3>Le bâtiment</h3><dl>${idr.map(([a,b])=>`<div><dt>${E(a)}</dt><dd>${E(b)}</dd></div>`).join('')}</dl></div><div><h4 class="sh2">Chiffres clés</h4><div class="kp">${kp.map(([a,b])=>`<div><b>${E(b)}</b><span>${a}</span></div>`).join('')}</div><h4 class="sh2">Travaux préconisés</h4>${Object.keys(tg).length?`<div class="tl">${Object.entries(tg).map(([c,a])=>`<div><h5>${E(c)}</h5><ol>${a.map(([l,x])=>`<li><span><b>${E(l)}</b> ${E(x)}</span></li>`).join('')}</ol></div>`).join('')}</div>`:'<p>Aucun travaux renseigné.</p>'}</div></div>
<div class="rb" style='background-image:${bg};background-position:center bottom;background-size:contain;background-repeat:no-repeat'></div><img class="cf" src="${$('.ft').src}">`;
 const rest=[['v'],['c','e'],['w','l','r']].map(a=>a.map(i=>H[i]).filter(Boolean).join('')).filter(Boolean);
 return pgs([p1,...rest],v.d_nom)}
async function rptPh(){const ps=DB?await gall():[];if(!ps.length)return null;const a=[];
 for(let i=0;i<ps.length;i+=12)a.push(`<div class="chh"><h2>Annexe photographique</h2>${ico('ph')}</div><div class="rule"></div><div class="pgr">${ps.slice(i,i+12).map((p,j)=>`<figure><img src="${p.d}"><figcaption><span class="pn">${i+j+1}</span><span>${E(p.cat)}${p.note?' – '+E(p.note):''}</span></figcaption></figure>`).join('')}</div>`);
 return pgs(a,A.v.d_nom)}
async function doPrint(h){$('#dg').close();$('#rpt').innerHTML=h;document.body.classList.add('ms');
 await Promise.all([...$$('#rpt img')].map(i=>i.decode().catch(()=>0)));
 $$('#rpt .pg').forEach(p=>{const m=p.querySelector('.in');let z=1;p.style.setProperty('--z',z);
  for(let i=0;i<10&&m.scrollHeight>m.clientHeight+1;i++){z=Math.max(.3,z*m.clientHeight/m.scrollHeight*.97);p.style.setProperty('--z',z)}});
 document.body.classList.remove('ms');document.body.classList.add('pr');window.onafterprint=()=>document.body.classList.remove('pr');setTimeout(()=>window.print(),400)}
$('#pr').onclick=async()=>doPrint(await rpt());
$('#pp').onclick=async()=>{const h=await rptPh();h?doPrint(h):toast('Aucune photo pour cette fiche')};
$('#cp').onclick=async e=>{const t=$('#tx');try{await navigator.clipboard.writeText(t.value)}catch(x){t.select();document.execCommand('copy')}
 e.target.textContent='Copié';setTimeout(()=>e.target.textContent='Copier le texte',1500)};
const dl=(n,t,m)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()};
$('#dt').onclick=()=>dl('fiche-visite.txt',$('#tx').value,'text/plain');
$('#bk').onclick=async()=>{const pl=[];for(const a of D.l)pl.push(...await gall(a.id));dl('sauvegarde-fiches.json',JSON.stringify({...D,ph:pl}),'application/json')};
$('#rb').onclick=()=>$('#rs').click();
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3500)};
async function imp(files){let n=0,bad=0,last=null;const pr=[];
 for(const fl of files){try{const j=JSON.parse(await fl.text()),L=j.l||(j.v?[j]:[]);
  for(const a0 of L){if(!a0||typeof a0.v!='object')continue;
   let a={...a0,id:a0.id||Date.now()+n},oid=a.id,nid=oid;const i=D.l.findIndex(x=>x.id==oid);
   if(i>=0&&(a.t||0)>(D.l[i].t||0))D.l[i]=a;
   else if(i>=0){nid=Date.now()+n;a={...a,id:nid,v:{...a.v,d_nom:(a.v.d_nom||'Fiche')+' (copie)'}};D.l.push(a)}
   else D.l.push(a);
   (j.ph||[]).filter(p=>p.aid==oid).forEach(p=>pr.push(pput(nid==oid?p:{...p,id:Date.now()*100+(pn++%100),aid:nid})));
   last=a;n++}}catch(x){bad++}}
 await Promise.all(pr);
 if(last){D.c=last.id;A=last;save();paint();go(0);$('#dg').close()}
 toast(n?n+' fiche(s) importée(s)'+(bad?' – '+bad+' fichier(s) ignoré(s)':''):'Fichier non reconnu')}
$('#rs').onchange=async e=>{await imp([...e.target.files]);e.target.value=''};
$('#im').onclick=()=>$('#rs').click();

const st=m=>{$('#ast').textContent=m},AD='https://api-adresse.data.gouv.fr/';let tm,FT=[];
async function sg(q){const s=$('#sug');if(q.length<3){s.innerHTML='';return}
 try{const j=await(await fetch(AD+'search/?limit=5&q='+encodeURIComponent(q))).json();FT=j.features;s.innerHTML=FT.map((x,i)=>`<button type="button" class="sg" data-i="${i}">${E(x.properties.label)}</button>`).join('');st('')}catch(x){s.innerHTML='';st('Suggestions indisponibles (réseau) : saisie manuelle.')}}
async function pcl(lo,la){st('Recherche de la parcelle…');
 try{const j=await(await fetch('https://apicarto.ign.fr/api/cadastre/parcelle?geom='+encodeURIComponent(JSON.stringify({type:'Point',coordinates:[lo,la]})))).json(),p=j.features&&j.features[0]&&j.features[0].properties;
  if(!p){st('Parcelle non trouvée : saisie manuelle.');return}
  set('d_parc',p.idu||'');set('d_sec',((p.section||'')+' '+(p.numero||'')).trim());if(p.contenance)set('d_cont',String(p.contenance));paint();st('Parcelle trouvée.')}catch(x){st('Cadastre indisponible : saisie manuelle.')}}
function pick(ft,c){const p=ft.properties,g=c||ft.geometry.coordinates;set('d_adr',p.name||p.label);set('d_cp',p.postcode||'');set('d_vil',p.city||'');set('d_insee',p.citycode||'');$('#sug').innerHTML='';paint();pcl(g[0],g[1])}
document.addEventListener('input',e=>{if(e.target.id=='adr'){clearTimeout(tm);const q=e.target.value;tm=setTimeout(()=>sg(q),250)}});
document.addEventListener('click',async e=>{const s=e.target.closest('.sg'),i=e.target.id;
 if(s)pick(FT[+s.dataset.i]);
 else if(i=='geo')navigator.geolocation.getCurrentPosition(async p=>{try{const lo=p.coords.longitude,la=p.coords.latitude,j=await(await fetch(AD+'reverse/?lon='+lo+'&lat='+la)).json();j.features[0]?pick(j.features[0],[lo,la]):st('Aucune adresse trouvée ici.')}catch(x){st('Réseau indisponible : saisie manuelle.')}},()=>st('Position refusée ou indisponible.'));
 else if(i=='pcl'){try{const j=await(await fetch(AD+'search/?limit=1&q='+encodeURIComponent([A.v.d_adr,A.v.d_cp,A.v.d_vil].join(' ')))).json();j.features[0]?pcl(...j.features[0].geometry.coordinates):st('Adresse introuvable.')}catch(x){st('Réseau indisponible : saisie manuelle.')}}});
let DB,pn=0;const PC=['Façade / vue générale','Murs','Toiture / combles','Menuiseries','Chaufferie / générateur','Émetteurs','ECS / ballon','Ventilation','Éclairage','Compteurs / plaques','Autre'];
const rq=indexedDB.open('fa-photos',1);rq.onupgradeneeded=()=>rq.result.createObjectStore('p',{keyPath:'id'});rq.onsuccess=()=>{DB=rq.result;ph()};
const os=m=>DB.transaction('p',m).objectStore('p'),
 gall=(id=A.id)=>new Promise(r=>{const x=os('readonly').getAll();x.onsuccess=()=>r(x.result.filter(p=>p.aid==id).sort((a,b)=>a.t-b.t))}),
 pput=p=>new Promise(r=>{const x=os('readwrite').put(p);x.onsuccess=r}),
 pdel=id=>new Promise(r=>{const x=os('readwrite').delete(id);x.onsuccess=r});
const rsz=fl=>new Promise(res=>{const im=new Image(),u=URL.createObjectURL(fl);im.onload=()=>{const z=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*z;c.height=im.height*z;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.72))};im.src=u});

document.addEventListener('click',e=>{const b=e.target;if(b.id=='cam')$('#fcam').click();else if(b.id=='imp')$('#fimp').click();else if(b.dataset&&b.dataset.pd)pdel(+b.dataset.pd).then(ph)});

 if(t.dataset.pc){const id=+t.closest('.pc').dataset.id,p=(await gall()).find(x=>x.id==id);if(p){p[t.dataset.pc]=t.value;await pput(p)}}});
